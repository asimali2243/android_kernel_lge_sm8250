name: Build LG V60 Kernel (Bulletproof KSU-Next + SuSFS)

on:
  workflow_dispatch:

jobs:
  build-kernel:
    runs-on: ubuntu-20.04 # <-- FIX IS HERE: Changed to 20.04 to fix APT dependency conflicts

    steps:
    - name: Cleanup & Setup Build Environment
      run: |
        echo "Freeing up disk space..."
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
        
        echo "Installing Dependencies..."
        sudo apt-get update
        # Removed conflicting multilib packages, kept only required ARM cross-compilers
        sudo apt-get install -y build-essential bc bison flex ccache curl git gnupg gperf imagemagick lib32ncurses5-dev lib32readline-dev lib32z1-dev liblz4-tool libncurses5 libncurses5-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python2 python3 gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi
        
        # Python 3 ko default set kar rahe hen purane scripts k liye
        sudo ln -sf /usr/bin/python3 /usr/bin/python

    - name: Clone LG V60 Kernel Source
      run: |
        git clone https://github.com/asimali2243/android_kernel_lge_sm8250.git kernel-source --depth=1

    - name: Download Stable Clang Toolchain (Proton)
      run: |
        git clone https://github.com/kdrag0n/proton-clang.git toolchain --depth=1

    - name: Patch KernelSU-Next and SuSFS (Fail-Proof)
      run: |
        cd kernel-source
        
        # 1. Official KernelSU-Next Injector
        echo "Applying KernelSU-Next..."
        curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -
        
        # 2. SuSFS Injector
        echo "Downloading SuSFS..."
        git clone https://gitlab.com/simonpunk/susfs4ksu.git
        
        # Copy SuSFS files to kernel tree
        cp -r susfs4ksu/kernel_patches/fs/* fs/
        cp -r susfs4ksu/kernel_patches/include/linux/* include/linux/
        
        # 3. Apply SuSFS Patch to Kernel
        echo "Patching Kernel 4.19 for SuSFS..."
        patch -p1 --forward < susfs4ksu/kernel_patches/50_add_susfs_in_kernel-4.19.patch || true
        
        # 4. Connect KernelSU-Next with SuSFS
        echo "Linking SuSFS with KernelSU-Next..."
        cd KernelSU*
        patch -p1 --forward < ../susfs4ksu/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch || true
        cd ..

    - name: Apply Safety Fixes & Required Configs
      run: |
        cd kernel-source
        
        # Remove -Werror
        find . -name "Makefile" -exec sed -i 's/-Werror//g' {} +
        
        # LG V60 k defconfig mein KernelSU aur SuSFS configs push karna
        DEFCONFIG="arch/arm64/configs/vendor/timelm-perf_defconfig"
        
        echo "Injecting KSU & SuSFS configs into $DEFCONFIG..."
        cat >> $DEFCONFIG <<EOF
        CONFIG_MODULES=y
        CONFIG_KPROBES=y
        CONFIG_HAVE_KPROBES=y
        CONFIG_KPROBE_EVENTS=y
        CONFIG_OVERLAY_FS=y
        CONFIG_KSU=y
        CONFIG_KSU_NEXT=y
        CONFIG_KSU_SUSFS=y
        CONFIG_KSU_SUSFS_SUS_PATH=y
        CONFIG_KSU_SUSFS_SUS_MOUNT=y
        CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT=y
        CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT=y
        CONFIG_KSU_SUSFS_SUS_KSTAT=y
        CONFIG_KSU_SUSFS_SPOOF_UNAME=y
        CONFIG_KSU_SUSFS_ENABLE_LOG=y
        EOF

    - name: Compile the Kernel
      run: |
        export PATH="$GITHUB_WORKSPACE/toolchain/bin:$PATH"
        
        # Common variable for both config and compile
        MAKE_ARGS="O=out ARCH=arm64 SUBARCH=arm64 CC=clang CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- LD=ld.lld AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip"
        
        cd kernel-source
        
        echo "Generating config..."
        make $MAKE_ARGS vendor/timelm-perf_defconfig
        
        echo "Starting Compilation (This takes 10-20 mins)..."
        make -j$(nproc --all) $MAKE_ARGS

    - name: Package into AnyKernel3 Zip
      run: |
        git clone https://github.com/osm0sis/AnyKernel3.git AnyKernel3 --depth=1
        
        # Grab kernel images
        cp kernel-source/out/arch/arm64/boot/Image AnyKernel3/ || true
        cp kernel-source/out/arch/arm64/boot/Image.gz AnyKernel3/ || true
        cp kernel-source/out/arch/arm64/boot/Image.lz4 AnyKernel3/ || true
        cp kernel-source/out/arch/arm64/boot/dts/vendor/qcom/*.dtb AnyKernel3/dtb || true
        
        cd AnyKernel3
        
        # Modify AnyKernel3 to support LG V60 (timelm)
        sed -i 's/device.name1=maguro/device.name1=timelm/g' anykernel.sh
        sed -i 's/device.name2=toro/device.name2=v60/g' anykernel.sh
        
        echo "Zipping flashable file..."
        zip -r9 ../LG_V60_KSU-Next_SuSFS_Working.zip * -x .git README.md *placeholder

    - name: Upload Final Flashable Zip
      uses: actions/upload-artifact@v4
      with:
        name: LG_V60_KSU-Next_SuSFS_Flashable
        path: LG_V60_KSU-Next_SuSFS_Working.zip
