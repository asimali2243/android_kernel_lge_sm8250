name: Build LG V60 Kernel
on: workflow_dispatch
jobs:
  build:
    name: Compile Kernel
    runs-on: ubuntu-22.04
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        repository: asimali2243/android_kernel_lge_sm8250
        path: kernel-source

    - name: Setup Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf imagemagick lib32ncurses5-dev lib32readline-dev lib32z1-dev liblz4-tool libncurses5-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python3

    - name: Download Toolchain
      run: git clone --depth=1 https://github.com/kdrag0n/proton-clang.git toolchains/proton-clang

    - name: Compile the Kernel
      run: |
        cd kernel-source
        
        # SukiSU Ultra Injector
        curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" | bash -
        
        export ARCH=arm64
        export SUBARCH=arm64
        export PATH="$GITHUB_WORKSPACE/toolchains/proton-clang/bin:${PATH}"
        export KBUILD_BUILD_USER="lutaif"
        export KBUILD_BUILD_HOST="github-actions"
        
        # FIX 1: LG OIS Camera Bug (Pichla wala)
        echo '#include <linux/module.h>' > techpack/camera/drivers/cam_sensor_module/cam_ois/lgit_onsemi/lgit_s5kgw1_onsemi_ois.c
        echo 'MODULE_LICENSE("GPL v2");' >> techpack/camera/drivers/cam_sensor_module/cam_ois/lgit_onsemi/lgit_s5kgw1_onsemi_ois.c
        
        # FIX 2: ESOC Header Syntax Error
        sed -i '36,40d' drivers/esoc/esoc.h
        
        # FIX 3: LG Display Panel Missing Functions
        sed -i 's/lge_get_factory_boot()/0/g' techpack/display/msm/lge/lge_dsi_panel.c
        sed -i 's/lge_get_mfts_mode()/0/g' techpack/display/msm/lge/lge_dsi_panel.c
        
        make O=out vendor/kona-perf_defconfig
        make -j$(nproc) O=out CC=clang CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- KCFLAGS="-Wno-error"

    - name: Upload Kernel
      uses: actions/upload-artifact@v4
      with:
        name: Compiled-Kernel-Image
        path: kernel-source/out/arch/arm64/boot/Image.gz
