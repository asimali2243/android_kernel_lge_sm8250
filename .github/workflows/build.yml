name: Build LG V60 Kernel + SukiSU Ultra

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: 1. Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          repository: asimali2243/android_kernel_lge_sm8250
          path: kernel-source
          fetch-depth: 1

      - name: 2. Install Dependencies
        run: |
          sudo apt update
          sudo apt install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf lib32readline-dev lib32z1-dev libelf-dev liblz4-tool libncurses-dev libssl-dev libxml2 libxml2-utils lzop rsync zip unzip python3 python-is-python3

      - name: 3. Clone Proton Clang
        run: git clone --depth=1 https://github.com/kdrag0n/proton-clang.git clang

      - name: 4. Add SukiSU Ultra
        run: |
          cd kernel-source
          curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" | bash -

      - name: 5. Master Fix (LG, ESOC, HID & KernelSU)
        run: |
          cd kernel-source
          
          # FIX 1: LG OIS Camera Bug bypass
          sed -i 's/obj-y += lgit_onsemi\//\#obj-y += lgit_onsemi\//g' techpack/camera/drivers/cam_sensor_module/cam_ois/Makefile
          
          # FIX 2: ESOC Header & Log bypass
          sed -i '36,40d' drivers/esoc/esoc.h
          find drivers/esoc -type f -name "*.c" -exec sed -i 's/esoc_mdm_log/pr_info/g' {} +
          
          # FIX 3: LG Display Panel Global Bypass
          find techpack/display -type f -name "*.c" -exec sed -i 's/lge_get_factory_boot()/0/g' {} +
          find techpack/display -type f -name "*.c" -exec sed -i 's/lge_get_mfts_mode()/0/g' {} +

          # FIX 4: HID Multitouch 'ABS' Error
          sed -i 's/TOUCH_D(ABS/pr_info(/g' drivers/hid/hid-multitouch.c

          # FIX 5: KernelSU MODULE_IMPORT_NS Fix (For 4.19 Kernels)
          if [ -f drivers/kernelsu/ksu.c ]; then
            sed -i '/MODULE_IMPORT_NS/d' drivers/kernelsu/ksu.c
          fi

      - name: 6. Build Kernel
        run: |
          cd kernel-source
          export ARCH=arm64
          export SUBARCH=arm64
          export PATH="${{ github.workspace }}/clang/bin:${PATH}"
          export KBUILD_BUILD_USER="lutaif"
          export KBUILD_BUILD_HOST="github-actions"
          
          make O=out vendor/kona-perf_defconfig
          
          make -j$(nproc) O=out \
            CC=clang \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            KCFLAGS="-Wno-error -Wno-implicit-function-declaration -Wno-unused-function -Wno-format -Wno-int-conversion"

      - name: 7. Package with AnyKernel3
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git AnyKernel3
          
          # Dhoondho kernel image
          find kernel-source/out/arch/arm64/boot/ -maxdepth 1 -name "Image*" -exec cp {} AnyKernel3/Image.gz \;
          
          if [ ! -f AnyKernel3/Image.gz ]; then
            echo "FAILED: Kernel image not found!"
            exit 1
          fi
          
          # DTBO copy
          [ -f kernel-source/out/arch/arm64/boot/dtbo.img ] && cp kernel-source/out/arch/arm64/boot/dtbo.img AnyKernel3/
          
          cd AnyKernel3
          sed -i 's/device.name1=maguro/device.name1=timelm/g' anykernel.sh
          sed -i 's/device.name2=toro/device.name2=v60/g' anykernel.sh
          zip -r9 ../LGV60-SukiSU-Ultra-Kernel.zip *

      - name: 8. Upload Result
        uses: actions/upload-artifact@v4
        with:
          name: LGV60-SukiSU-Kernel
          path: LGV60-SukiSU-Ultra-Kernel.zip
