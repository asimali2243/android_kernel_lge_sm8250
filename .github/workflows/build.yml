name: Build LG V60 Kernel + SukiSU Ultra

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - lineage-23.2

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install Dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            bc bison build-essential ccache curl flex g++-multilib \
            gcc-multilib git gnupg gperf lib32ncurses5-dev \
            lib32readline-dev lib32z1-dev libelf-dev liblz4-tool \
            libncurses5-dev libssl-dev libxml2 libxml2-utils \
            lzop rsync zip unzip python3 python-is-python3

      - name: Clone Proton Clang
        run: |
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git clang

      - name: Add SukiSU Ultra
        run: |
          curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" | bash -

      - name: Export Build Environment
        run: |
          echo "ARCH=arm64" >> $GITHUB_ENV
          echo "SUBARCH=arm64" >> $GITHUB_ENV
          echo "PATH=${{ github.workspace }}/clang/bin:$PATH" >> $GITHUB_ENV

      - name: Apply LG Display Fixes
        run: |
          find techpack/display -type f \( -name "*.c" -o -name "*.h" \) \
          -exec sed -i 's/lge_get_factory_boot()/0/g' {} \;

          find techpack/display -type f \( -name "*.c" -o -name "*.h" \) \
          -exec sed -i 's/lge_get_mfts_mode()/0/g' {} \;

      - name: Configure Kernel (LG V60)
        run: |
          make O=out vendor/kona-perf_defconfig
          make O=out olddefconfig

      - name: Build Kernel
        run: |
          make -j$(nproc) O=out \
            CC=clang \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            KCFLAGS="-Wno-error" \
            2>&1 | tee build.log

      - name: Clone AnyKernel3
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git AnyKernel3
          cp out/arch/arm64/boot/Image AnyKernel3/
          cp out/arch/arm64/boot/dtb AnyKernel3/ || true
          cp out/arch/arm64/boot/dtbo.img AnyKernel3/ || true

      - name: Create Flashable Zip
        run: |
          cd AnyKernel3
          zip -r9 ../LGV60-SukiSU-Ultra-Kernel.zip *

      - name: Upload Kernel Zip
        uses: actions/upload-artifact@v4
        with:
          name: LGV60-SukiSU-Ultra-Kernel
          path: LGV60-SukiSU-Ultra-Kernel.zip

      - name: Upload Build Log
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
