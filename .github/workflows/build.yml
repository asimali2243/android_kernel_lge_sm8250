name: Build LG V60 Kernel + KSU-Next

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: 1. Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          repository: asimali2243/android_kernel_lge_sm8250
          path: kernel-source
          fetch-depth: 1

      - name: 2. Install Dependencies
        run: |
          sudo apt update
          sudo apt install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf lib32readline-dev lib32z1-dev libelf-dev liblz4-tool libncurses-dev libssl-dev libxml2 libxml2-utils lzop rsync zip unzip python3 python-is-python3

      - name: 3. Clone Proton Clang
        run: git clone --depth=1 https://github.com/kdrag0n/proton-clang.git clang

      - name: 4. Integrate KSU-Next
        run: |
          cd kernel-source
          curl -LSs "https://raw.githubusercontent.com/rifsxd/KernelSU-Next/next/kernel/setup.sh" | bash -

      - name: 5. Master Surgical Fixes (LG Hardware + 4.19 Compat)
        run: |
          cd kernel-source
          
          # FIX 1: LG OIS Camera Bug bypass
          sed -i 's/obj-y += lgit_onsemi\//\#obj-y += lgit_onsemi\//g' techpack/camera/drivers/cam_sensor_module/cam_ois/Makefile
          
          # FIX 2: ESOC Header & Log bypass
          sed -i '36,40d' drivers/esoc/esoc.h
          find drivers/esoc -type f -name "*.c" -exec sed -i 's/esoc_mdm_log/pr_info/g' {} +
          
          # FIX 3: LG Display Panel Missing Functions (Global Bypass)
          find techpack/display -type f -name "*.c" -exec sed -i 's/lge_get_factory_boot()/0/g' {} +
          find techpack/display -type f -name "*.c" -exec sed -i 's/lge_get_mfts_mode()/0/g' {} +

          # FIX 4: HID Multitouch 'ABS' Macro Fix
          sed -i 's/TOUCH_D(ABS/pr_info(/g' drivers/hid/hid-multitouch.c

          # FIX 5: LG Global Boot Mode Fix (Radio, Wi-Fi, etc)
          find drivers -type f -name "*.c" -exec sed -i 's/LGE_BOOT_MODE_QEM_56K/56/g' {} +
          find drivers -type f -name "*.c" -exec sed -i 's/LGE_BOOT_MODE_QEM_910K/910/g' {} +
          find drivers -type f -name "*.c" -exec sed -i 's/LGE_BOOT_MODE_CHARGERLOGO/13/g' {} +

          # FIX 6: Power Supply '__lpd_ux' Error (Latest Fix)
          sed -i 's/__lpd_ux = true;//g' drivers/power/supply/qcom/qpnp-smb5.c
          
          # FIX 7: KSU-Next 4.19 macro fixes
          find drivers/kernelsu -type f -name "*.c" -exec sed -i 's/access_ok(/access_ok(0, /g' {} +

      - name: 6. Configure Kernel
        run: |
          cd kernel-source
          export ARCH=arm64
          make O=out vendor/kona-perf_defconfig
          
          # Enable KSU & Kallsyms
          scripts/config --file out/.config --enable CONFIG_KSU
          scripts/config --file out/.config --enable CONFIG_KALLSYMS
          scripts/config --file out/.config --enable CONFIG_KALLSYMS_ALL
          
          make O=out ARCH=arm64 olddefconfig

      - name: 7. Build Kernel
        run: |
          cd kernel-source
          export ARCH=arm64
          export SUBARCH=arm64
          export PATH="${{ github.workspace }}/clang/bin:${PATH}"
          export KBUILD_BUILD_USER="lutaif"
          export KBUILD_BUILD_HOST="github-actions"
          
          make -j$(nproc) O=out \
            CC=clang \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            KCFLAGS="-Wno-error -Wno-implicit-function-declaration -Wno-unused-function -Wno-format -Wno-int-conversion"

      - name: 8. Package with AnyKernel3
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git AnyKernel3
          
          # Smart Finder logic
          cd kernel-source/out/arch/arm64/boot/
          KERNEL_FILE=$(ls Image.gz-dtb Image.gz Image 2>/dev/null | head -n 1)
          
          if [ -z "$KERNEL_FILE" ]; then
            echo "FAILED: Kernel image not found!"
            exit 1
          fi
          
          cp $KERNEL_FILE ../../../../../AnyKernel3/Image.gz
          [ -f dtbo.img ] && cp dtbo.img ../../../../../AnyKernel3/
          
          cd ../../../../../AnyKernel3
          sed -i 's/device.name1=maguro/device.name1=timelm/g' anykernel.sh
          sed -i 's/device.name2=toro/device.name2=v60/g' anykernel.sh
          zip -r9 ../LGV60-KSU-Next-Kernel.zip *

      - name: 9. Upload Result
        uses: actions/upload-artifact@v4
        with:
          name: LGV60-KSU-Next-Kernel
          path: LGV60-KSU-Next-Kernel.zip
