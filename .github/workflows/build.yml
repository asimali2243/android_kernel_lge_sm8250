name: Build LGE SM8250 Kernel (KSU-Next + sufs)

on:
  workflow_dispatch: # Allows you to trigger the build manually

jobs:
  build-kernel:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Kernel Source
      uses: actions/checkout@v4
      with:
        # Defaults to the repository where this workflow is placed
        fetch-depth: 1

    - name: Setup Build Environment
      run: |
        echo "Installing Dependencies..."
        sudo apt-get update
        sudo apt-get install -y build-essential bc bison flex ccache curl g++-multilib gcc-multilib git gnupg gperf imagemagick lib32ncurses5-dev lib32readline-dev lib32z1-dev liblz4-tool libncurses5 libncurses5-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python3
        
        echo "Downloading Proton Clang Toolchain..."
        mkdir -p ${{ github.workspace }}/toolchain
        cd ${{ github.workspace }}/toolchain
        git clone --depth=1 https://github.com/kdrag0n/proton-clang.git

    - name: Integrate KernelSU-Next and sufs
      run: |
        # Inject KernelSU-Next
        echo "Patching KernelSU-Next..."
        curl -LSs "https://raw.githubusercontent.com/rifsxd/KernelSU-Next/next/setup.sh" | bash -
        
        # Inject sufs
        # (Using the standard sufs integration script)
        echo "Patching sufs..."
        curl -LSs "https://raw.githubusercontent.com/zxcvbnm3057/sufs/main/setup.sh" | bash -

    - name: Build Kernel
      run: |
        export PATH="${{ github.workspace }}/toolchain/proton-clang/bin:$PATH"
        export ARCH=arm64
        export SUBARCH=arm64
        export CROSS_COMPILE=aarch64-linux-gnu-
        export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
        export CC=clang
        export LD=ld.lld
        export AR=llvm-ar
        export NM=llvm-nm
        export OBJCOPY=llvm-objcopy
        export OBJDUMP=llvm-objdump
        export STRIP=llvm-strip

        # IMPORTANT: Replace 'vendor/kona-perf_defconfig' with your device's exact defconfig
        # Examples for LG devices: vendor/timelm-perf_defconfig, vendor/cayman-perf_defconfig, etc.
        DEFCONFIG="vendor/kona-perf_defconfig" 
        
        echo "Making defconfig: $DEFCONFIG"
        make O=out $DEFCONFIG
        
        echo "Starting compilation..."
        make -j$(nproc --all) O=out \
                              CC=clang \
                              CROSS_COMPILE=aarch64-linux-gnu- \
                              CROSS_COMPILE_ARM32=arm-linux-gnueabi-

    - name: Upload Kernel Artifact
      uses: actions/upload-artifact@v4
      with:
        name: AnyKernel3-Flashable-Zip # Or just the raw image
        # The output path varies. Usually it's Image.gz, Image.gz-dtb, or Image.lz4
        path: |
          out/arch/arm64/boot/Image
          out/arch/arm64/boot/Image.gz
          out/arch/arm64/boot/Image.lz4
          out/arch/arm64/boot/dts/vendor/qcom/*.dtb
