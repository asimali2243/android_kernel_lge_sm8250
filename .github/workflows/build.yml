name: Build LG V60 Kernel + SukiSU Ultra

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          repository: asimali2243/android_kernel_lge_sm8250
          path: kernel-source
          ref: lineage-23.2

      - name: Install Dependencies
        run: |
          sudo apt update
          sudo apt install -y bc bison build-essential flex curl zip unzip \
          gcc g++ git python3 cpio libssl-dev

      - name: Clone Proton Clang
        run: git clone --depth=1 https://github.com/kdrag0n/proton-clang clang

      - name: Add SukiSU Ultra
        run: |
          cd kernel-source
          curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" | bash -s nongki

      - name: Build Kernel
        run: |
          cd kernel-source

          export ARCH=arm64
          export SUBARCH=arm64
          export PATH="${{ github.workspace }}/clang/bin:$PATH"

          make O=out vendor/kona-perf_defconfig

          make -j$(nproc) O=out \
            CC=clang \
            CROSS_COMPILE=aarch64-linux-android- \
            CROSS_COMPILE_ARM32=arm-linux-androideabi-

      - name: Package AnyKernel3
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3 AnyKernel3

          cp kernel-source/out/arch/arm64/boot/Image.gz-dtb AnyKernel3/

          cd AnyKernel3
          zip -r9 ../kernel.zip *

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: LGV60-Kernel
          path: kernel.zip
