name: Build LG V60 Kernel

# This allows you to manually trigger the build from the GitHub Actions tab
on:
  workflow_dispatch:

jobs:
  build:
    name: Compile Kernel
    runs-on: ubuntu-22.04 # GitHub's free cloud server environment

    steps:
    - name: 1. Checkout Kernel Source
      uses: actions/checkout@v4
      with:
        repository: asimali2243/android_kernel_lge_sm8250
        path: kernel-source

    - name: 2. Setup Build Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf imagemagick lib32ncurses5-dev lib32readline-dev lib32z1-dev liblz4-tool libncurses5-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python3

    - name: 3. Download Proton Clang Toolchain
      run: |
        git clone --depth=1 https://github.com/kdrag0n/proton-clang.git toolchains/proton-clang

    - name: 4. Compile the Kernel
      run: |
        cd kernel-source
        
        # Set up the environment variables
        export ARCH=arm64
        export SUBARCH=arm64
        export PATH="$GITHUB_WORKSPACE/toolchains/proton-clang/bin:${PATH}"
        
        # Initialize the configuration. 
        # IMPORTANT: Change 'vendor/kona-perf_defconfig' if the developer used a different name!
        make O=out vendor/kona-perf_defconfig
        
        # Start the compiler
        make -j$(nproc) O=out \
                        CC=clang \
                        CROSS_COMPILE=aarch64-linux-gnu- \
                        CROSS_COMPILE_ARM32=arm-linux-gnueabi-

    - name: 5. Upload Compiled Kernel (Artifact)
      uses: actions/upload-artifact@v4
      with:
        name: Compiled-Kernel-Image
        path: kernel-source/out/arch/arm64/boot/Image.gz
