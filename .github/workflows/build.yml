name: Build SukiSU Ultra Kernel
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v3

      - name: Install Toolchain & Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf lib32ncurses5-dev lib32z1-dev liblz4-tool libncurses5-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev
          # Clang toolchain download karna
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git clang

      - name: Integrate SukiSU Ultra
        run: |
          # SukiSU Ultra ki official integration command for non-GKI (builtin)
          curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" | bash -s builtin

      - name: Add SukiSU Config
        run: |
          # Kernel configuration mein KSU enable karna
          echo "CONFIG_KSU=y" >> arch/arm64/configs/vendor/kona-perf_defconfig

      - name: Compile Kernel
        env:
          # Yahan aapke device ka defconfig aayega (sm8250 ke liye usually vendor/kona-perf_defconfig hota hai)
          DEFCONFIG: "vendor/kona-perf_defconfig" 
        run: |
          export PATH=$(pwd)/clang/bin:$PATH
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          export CC=clang
          export AR=llvm-ar
          export NM=llvm-nm
          export OBJCOPY=llvm-objcopy
          export OBJDUMP=llvm-objdump
          export STRIP=llvm-strip
          export ARCH=arm64

          make O=out $DEFCONFIG
          make -j$(nproc) O=out CC=clang CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi-

      - name: Upload Compiled Kernel Image
        uses: actions/upload-artifact@v3
        with:
          name: SukiSU-Ultra-Kernel
          path: out/arch/arm64/boot/Image*
